<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Список постов</title>

    <style>
        body {
            margin: 0;
            padding: 30px;
            background-color: #f4f4f4;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            color: #222;
        }

        .create-button {
            display: inline-block;
            margin-bottom: 20px;
            padding: 12px 20px;
            color: white;
            background-color: #28a745;
            border-radius: 5px;
            text-decoration: none;
        }

        .create-button:hover {
            background-color: #218838;
        }

        .post {
            margin-bottom: 20px;
            padding: 20px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 7px rgba(0, 0, 0, 0.1);
        }

        .post h2 {
            margin-top: 0;
        }

        .post-content {
            white-space: pre-wrap;
        }

        .post-date {
            color: #777;
            font-size: 14px;
        }

        .delete-button {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 15px;
            color: white;
            background-color: #dc3545;
            border-radius: 5px;
            text-decoration: none;
        }

        .delete-button:hover {
            background-color: #c82333;
        }

        .empty-message {
            padding: 20px;
            background-color: white;
            border-radius: 8px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Список постов</h1>

        <a href="{% url 'posts:create_post' %}" class="create-button">
            Создать новый пост
        </a>

        {% for post in posts %}
            <div class="post">
                <h2>{{ post.title }}</h2>

                <div class="post-content">
                    {{ post.content }}
                </div>

                <p class="post-date">
                    Дата создания:
                    {{ post.created_at|date:"d.m.Y H:i" }}
                </p>

                <a
                    href="{% url 'posts:post_delete' post.id %}"
                    class="delete-button"
                >
                    Удалить пост
                </a>
            </div>
        {% empty %}
            <div class="empty-message">
                Постов пока нет. Создайте первый пост.
            </div>
        {% endfor %}
    </div>
</body>
</html>
