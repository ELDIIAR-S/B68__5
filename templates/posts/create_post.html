<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Создание поста</title>

    <style>
        body {
            margin: 0;
            padding: 30px;
            background-color: #f4f4f4;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            padding: 25px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 7px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input,
        textarea {
            box-sizing: border-box;
            width: 100%;
            padding: 10px;
            border: 1px solid #bbb;
            border-radius: 5px;
            font-size: 16px;
        }

        .save-button {
            margin-top: 20px;
            padding: 12px 20px;
            color: white;
            background-color: #28a745;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .save-button:hover {
            background-color: #218838;
        }

        .back-button {
            display: inline-block;
            margin-left: 10px;
            color: #333;
            text-decoration: none;
        }

        .errorlist {
            padding-left: 20px;
            color: #dc3545;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Создание нового поста</h1>

        <form method="post">
            {% csrf_token %}

            {{ form.non_field_errors }}

            <div>
                {{ form.title.label_tag }}
                {{ form.title }}
                {{ form.title.errors }}
            </div>

            <div>
                {{ form.content.label_tag }}
                {{ form.content }}
                {{ form.content.errors }}
            </div>

            <button type="submit" class="save-button">
                Создать пост
            </button>

            <a href="{% url 'posts:list_posts' %}" class="back-button">
                Отмена
            </a>
        </form>
    </div>
</body>
</html>
